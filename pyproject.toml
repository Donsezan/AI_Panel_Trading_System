[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradebot"
version = "0.1.0"
description = "AI Panel Trading System — multi-LLM deliberation trading engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
tradebot = "tradebot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tradebot"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tradebot", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime — candle alignment and auth signatures break on this
    "T20",       # no print()
    "SIM",       # simplify
    "RET",       # return consistency
    "ARG",       # unused arguments
    "PTH",       # pathlib
    "ASYNC",     # async correctness
    "S",         # bandit
    "TID",       # tidy imports
    "RUF",
]
ignore = [
    "S101",    # assert: used deliberately for single-writer/invariant enforcement
    "RET504",  # named return values aid debugging in money paths
    # Docs and docstrings quote DESIGN.md notation verbatim (2×ATR, ≥, ⅓, en dashes).
    # Faithful citation of the spec beats homoglyph paranoia in prose.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "DTZ"]
"scripts/**" = ["T20"]   # the check runner reports to a human on stdout
"tradebot/core/logging.py" = ["A005"]   # module name shadows stdlib by design (package-qualified)

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"decimal.getcontext".msg = "Use tradebot.core.money.money_context(); global Decimal context is shared state."

[tool.ruff.lint.isort]
known-first-party = ["tradebot"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# Strict exactly where mistakes cost money.
[[tool.mypy.overrides]]
module = ["tradebot.core.*", "tradebot.risk.*", "tradebot.execution.*", "tradebot.ledger.*"]
strict = true
disallow_any_explicit = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "scenario: full-loop scenario and chaos tests (rung 3)",
    "contract: adapter contract tests (rung 2)",
]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["tradebot"]
omit = ["tradebot/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
]
